 <!DOCTYPE html>
 <html lang="pt">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>My Gallery</title>

 <!--Tailwind -->
 <script src="https://cdn.tailwindcss.com"></script>
 </head>

 <body class="bg-gray-100 min-h-screen p-6">

    <header class="text-center mb-8">
 <h1 class="text-4xl font-bold text-gray-800 tracking-wide uppercase">Portfolio</h1>
 <p class="text-gray-600 mt-2">Photographic/Cinematographic Gallery</p>
 </header>

 <!--Breakpoints-->
 <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="flowers.JPG" alt="Foto 1" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Flowers</div>
 </div>

 <!--Gallery-->

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="movement.JPG" alt="Foto 2" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Movement</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="city.JPG" alt="Foto 3" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Urban Beauty</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="urban light.JPG" alt="Foto 4" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Urban Light</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="reflection of time.JPG" alt="Foto 5" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Reflection of Time</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="distance.JPG" alt="Foto 6" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Distance</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="Lilies.JPG" alt="Foto 7" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Lilies</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="urban sky.JPG" alt="Foto 8" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Urban Sky</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="golden light.JPG" alt="Foto 9" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Golden Light</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="Speed.JPG" alt="Foto 10" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Speed</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="meeting.JPG" alt="Foto 11" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Meeting</div>
 </div>

 <div class="bg-white rounded-lg overflow-hidden shadow-md cursor-pointer hover:scale-[1.02] transition-transform duration-300">
    <img src="contemplating.JPG" alt="Foto 12" class="w-full h-64 object-cover">
    <div class="p-4 text-center font-medium text-gray-700">Contemplating</div>
 </div>
 </main>

 <!--Lightbox-->
 <div id="lightbox" class="fixed inset-0 bg-black/95 flex flex-col justify-center items-center hidden z-50 p-4">
    <span class="absolute top-4 right-6 text-white text-5xl cursor-pointer font-bold select-none">&times;</span>
    <img id="lightbox-img" src="about:blank" alt="Zoom" class="max-w-full max-h-[80vh] rounded-lg shadow-2xl">
    <p id="lightbox-caption" class="text-white mt-4 text-lg font-medium"></p>
 </div>

 <script>
    const galleryItems = document.querySelectorAll('main > div');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');

    galleryItems.forEach(item => {
        item.addEventListener('click' , () => {
            const img = item.querySelector('img');
            const caption = item.querySelector('.p-4');

            lightboxImg.src = img.src;
            lightboxCaption.textContent = caption.textContent;
            lightbox.classList.remove('hidden');
        });
    });

    lightbox.addEventListener('click' , () => {
        lightbox.classList.add('hidden');
    });
 </script>
 </body>
 </html>
